services:
  nginx:
    image: nginx:alpine
    container_name: mini-paas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mini-paas

networks:
  mini-paas:
    name: mini-paas