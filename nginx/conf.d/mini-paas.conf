server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        return 404 "Mini-PaaS Router: Route not found";
    }

    location /Masab-Ahmedba0a42fd-a4cb-43c0-829b-2dc012cf6be5/ {
        set $upstream_Masab_Ahmedba0a42fd_a4cb_43c0_829b_2dc012cf6be5 http://Masab-Ahmedba0a42fd-a4cb-43c0-829b-2dc012cf6be5:3000/;
        proxy_pass $upstream_Masab_Ahmedba0a42fd_a4cb_43c0_829b_2dc012cf6be5;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

}
